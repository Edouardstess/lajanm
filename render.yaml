# Infrastructure Lajan'm sur Render, décrite dans le dépôt.
#
# Déploiement : Render → New → Blueprint → sélectionner ce dépôt.
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │ CE FICHIER EST RÉGLÉ SUR LES PLANS GRATUITS — POUR TESTER, PAS POUR  │
# │ DÉTENIR DE L'ARGENT RÉEL.                                            │
# │                                                                      │
# │ C'est le réglage correct pour l'étape où en est le projet : la note  │
# │ de gouvernance (docs/audit-readiness.md) interdit de toute façon un  │
# │ lancement avec des fonds réels avant clarification du statut FSP     │
# │ (Circulaire BRH n°121).                                              │
# │                                                                      │
# │ Ce que le gratuit implique, sans détour :                            │
# │  • la base PostgreSQL EXPIRE (~30 jours) et n'est JAMAIS sauvegardée │
# │  • le service s'endort après ~15 min sans trafic, et le réveil prend │
# │    ~50 s : la première requête après une pause semblera très lente   │
# │  • Redis n'est pas persistant — une file perdue = un dépôt non rejoué│
# │                                                                      │
# │ AVANT LE MOINDRE FRANC RÉEL, passer aux plans payants :              │
# │   databases.plan : free → basic-256mb  (sauvegardes automatiques)    │
# │   services.plan  : free → starter      (pas de mise en veille)       │
# │ et voir docs/release.md pour la version production complète.         │
# └──────────────────────────────────────────────────────────────────────┘
#
# Pourquoi Render et pas un hébergeur serverless : l'API fait tourner un
# worker BullMQ (TopupInitiationProcessor) qui rejoue les dépôts MonCash
# échoués. Il lui faut un processus permanent — sans quoi un client paie
# chez MonCash et n'est jamais crédité.

databases:
  - name: lajanm-postgres
    databaseName: lajanm
    user: lajanm
    # Virginie : la région la plus proche d'Haïti chez Render.
    region: virginia
    plan: free
    ipAllowList: []   # accès via le réseau privé Render uniquement

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: lajanm-api
    runtime: docker
    region: virginia
    plan: free
    # Le Dockerfile copie package.json et package-lock.json depuis la
    # racine du monorepo : le contexte de build doit donc être la racine.
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health

    # Aucune commande n'est définie ici : c'est le CMD du Dockerfile qui
    # applique les migrations puis démarre l'API. Un `dockerCommand` avec
    # guillemets voit ceux-ci conservés littéralement, et le conteneur sort
    # en 127. Les migrations tournent au démarrage plutôt que via
    # `preDeployCommand`, réservé aux plans payants ; TypeORM ignorant
    # celles déjà appliquées, c'est sans effet de bord.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      - key: DATABASE_URL
        fromDatabase:
          name: lajanm-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: lajanm-redis
          type: redis
          property: connectionString

      # Généré par Render : personne ne le choisit, personne ne le voit
      # passer, et il ne peut pas être recopié depuis un autre
      # environnement (NF-24).
      - key: JWT_SECRET
        generateValue: true

      # Origine du back-office Vercel, à renseigner après son déploiement.
      # Laissée vide, l'API reflète l'origine appelante — acceptable en
      # test, jamais en production.
      - key: CORS_ORIGINS
        sync: false

      # Note de gouvernance : garder l'URL sandbox tant que le statut FSP
      # n'est pas clarifié. Ne pas basculer sur MonCash production avant.
      - key: MONCASH_BASE_URL
        value: https://sandbox.moncashbutton.digicelgroup.com/Api
      - key: MONCASH_CLIENT_ID
        sync: false
      - key: MONCASH_CLIENT_SECRET
        sync: false
      - key: MONCASH_WEBHOOK_SECRET
        sync: false

      # Plafond réglementaire par transaction (BRH Circulaire n°121),
      # actif par défaut et non codé en dur.
      - key: PAYOUT_MAX_AMOUNT_HTG
        value: 100000

  # -------------------------------------------------------------- Redis
  - type: redis
    name: lajanm-redis
    region: virginia
    plan: free
    # Files BullMQ uniquement : jamais exposé publiquement.
    ipAllowList: []
    # Les files ne doivent pas être vidées sous pression mémoire : un job
    # de rejeu supprimé, c'est un dépôt client jamais crédité.
    maxmemoryPolicy: noeviction
