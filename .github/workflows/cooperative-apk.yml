name: APK Coopérative Agricole

# Compile le projet Android `cooperative-agricole/` (projet scolaire UNITECH,
# indépendant du reste du dépôt) et dépose l'APK de debug en artefact du run.
#
# Les runners GitHub embarquent le SDK Android : aucun compte ni secret n'est
# nécessaire. Récupérer l'APK : Actions → ce run → section « Artifacts ».

on:
  workflow_dispatch:
  push:
    paths:
      - 'cooperative-agricole/**'
      - '.github/workflows/cooperative-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cooperative-agricole

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Les tests des règles de saisie tournent sur la JVM : ils échouent vite
      # et sans émulateur, donc ils passent avant la compilation de l'APK.
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --no-daemon

      # Les tests des DAO demandent un appareil pour s'exécuter, mais rien
      # n'empêche de les compiler : un fichier livré qui ne compile pas est un
      # défaut, même s'il n'est jamais lancé ici.
      - name: Compiler les tests instrumentés
        run: ./gradlew compileDebugAndroidTestKotlin --no-daemon

      - name: Compiler l'APK de debug
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cooperative-agricole-apk-debug
          path: cooperative-agricole/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
