# Réglages Gradle du projet.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Style de code Kotlin officiel
kotlin.code.style=official

# Délais d'attente réseau généreux (2 minutes au lieu de 30 secondes par
# défaut). La première synchronisation télécharge plusieurs centaines de Mo
# depuis les dépôts Google et Maven Central : sur une connexion lente ou
# instable, les délais par défaut la font échouer alors qu'elle progressait.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
