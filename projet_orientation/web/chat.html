<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<title>Assistant d'orientation — Nouveau Secondaire</title>
<style>
  :root {
    --fond: #ffffff;
    --fond-alt: #f7f8fa;
    --bord: #e3e6ea;
    --texte: #1f2733;
    --discret: #6b7684;
    --accent: #2d6ca2;
    --accent-clair: #eaf1f8;
    --bulle-user: #2d6ca2;
    --bulle-user-texte: #ffffff;
    --smp: #4c78a8;
    --svt: #54a24b;
    --ses: #d99a2b;
    --lla: #a86fa0;
    --alerte-fond: #fdf6e3;
    --alerte-bord: #e8d9a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #1a1d21;
      --fond-alt: #22262b;
      --bord: #343a41;
      --texte: #e7eaee;
      --discret: #9aa4b0;
      --accent: #6fa8dc;
      --accent-clair: #24303c;
      --bulle-user: #35618c;
      --alerte-fond: #33301f;
      --alerte-bord: #55502f;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font: 15.5px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ---------------- En-tête ---------------- */
  header {
    border-bottom: 1px solid var(--bord);
    background: var(--fond);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .barre {
    max-width: 820px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .marque {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 17px;
    flex-shrink: 0;
  }
  .titres { flex: 1; min-width: 0; }
  .titres h1 { margin: 0; font-size: 15.5px; font-weight: 650; }
  .titres p {
    margin: 0;
    font-size: 12.5px;
    color: var(--discret);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lien-entete {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    padding: 6px 11px;
    border: 1px solid var(--bord);
    border-radius: 7px;
    white-space: nowrap;
  }
  .lien-entete:hover { background: var(--fond-alt); }

  /* ---------------- Conversation ---------------- */
  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px 8px;
  }
  .fil { max-width: 820px; margin: 0 auto; }

  .tour { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start; }
  .tour.moi { flex-direction: row-reverse; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .avatar.ia { background: var(--accent); color: #fff; }
  .avatar.moi { background: var(--fond-alt); border: 1px solid var(--bord); }

  .contenu { max-width: 82%; min-width: 0; }
  .tour.moi .contenu { display: flex; flex-direction: column; align-items: flex-end; }

  .bulle {
    padding: 11px 15px;
    border-radius: 14px;
    background: var(--fond-alt);
    border: 1px solid var(--bord);
    overflow-wrap: break-word;
  }
  .tour.moi .bulle {
    background: var(--bulle-user);
    border-color: var(--bulle-user);
    color: var(--bulle-user-texte);
    border-bottom-right-radius: 5px;
  }
  .tour.ia .bulle { border-bottom-left-radius: 5px; }
  .bulle + .bulle { margin-top: 8px; }
  .bulle p { margin: 0 0 9px; }
  .bulle p:last-child { margin-bottom: 0; }
  .bulle ul { margin: 6px 0; padding-left: 20px; }
  .bulle li { margin-bottom: 3px; }
  .bulle strong { font-weight: 650; }
  .bulle em { color: var(--discret); font-style: italic; }

  .bulle.alerte {
    background: var(--alerte-fond);
    border-color: var(--alerte-bord);
  }

  /* ---------------- Carte de résultat ---------------- */
  .resultat {
    margin-top: 10px;
    border: 1px solid var(--bord);
    border-radius: 14px;
    padding: 16px;
    background: var(--fond);
  }
  .resultat .serie {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 1px;
  }
  .resultat .libelle {
    margin: 0 0 14px;
    color: var(--discret);
    font-size: 13.5px;
  }
  .resultat .etiquette {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--discret);
    margin-bottom: 6px;
  }
  .barre-proba { margin-bottom: 10px; }
  .barre-proba .entete {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 3px;
  }
  .barre-proba .nom { font-weight: 650; }
  .barre-proba .piste {
    height: 9px;
    background: var(--bord);
    border-radius: 5px;
    overflow: hidden;
  }
  .barre-proba .remplissage {
    height: 100%;
    border-radius: 5px;
    width: 0;
    transition: width .5s cubic-bezier(.2,.8,.2,1);
  }
  .barre-proba.secondaire { opacity: .55; }

  /* ---------------- Indicateur de frappe ---------------- */
  .frappe { display: flex; gap: 4px; padding: 4px 2px; }
  .frappe span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--discret);
    animation: rebond 1.3s infinite;
  }
  .frappe span:nth-child(2) { animation-delay: .18s; }
  .frappe span:nth-child(3) { animation-delay: .36s; }
  @keyframes rebond {
    0%, 60%, 100% { transform: translateY(0); opacity: .35; }
    30%           { transform: translateY(-5px); opacity: 1; }
  }

  /* ---------------- Zone de saisie ---------------- */
  footer {
    border-top: 1px solid var(--bord);
    background: var(--fond);
    padding: 12px 20px 16px;
  }
  .zone { max-width: 820px; margin: 0 auto; }

  #suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 10px;
  }
  .puce {
    padding: 6px 13px;
    border: 1px solid var(--bord);
    border-radius: 999px;
    background: var(--fond);
    color: var(--accent);
    font: inherit;
    font-size: 13.5px;
    cursor: pointer;
  }
  .puce:hover { background: var(--accent-clair); }

  .saisie {
    display: flex;
    align-items: flex-end;
    gap: 9px;
    border: 1px solid var(--bord);
    border-radius: 14px;
    padding: 8px 8px 8px 14px;
    background: var(--fond);
  }
  .saisie:focus-within { border-color: var(--accent); }
  #message {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: inherit;
    font: inherit;
    max-height: 150px;
    padding: 5px 0;
  }
  #envoyer {
    width: 34px; height: 34px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  #envoyer:disabled { background: var(--bord); cursor: default; }
  #envoyer svg { width: 17px; height: 17px; }

  .mention {
    margin: 9px 0 0;
    font-size: 11.5px;
    color: var(--discret);
    text-align: center;
  }
  .mention a { color: var(--discret); }

  @media (max-width: 600px) {
    .contenu { max-width: 88%; }
    .titres p { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="barre">
    <div class="marque" aria-hidden="true">🎓</div>
    <div class="titres">
      <h1>Assistant d'orientation</h1>
      <p id="sous-titre">Nouveau Secondaire — SMP, SVT, SES, LLA</p>
    </div>
    <a class="lien-entete" href="/formulaire">Formulaire</a>
  </div>
</header>

<div id="conversation">
  <div class="fil" id="fil"></div>
</div>

<footer>
  <div class="zone">
    <div id="suggestions"></div>
    <form class="saisie" id="formulaire">
      <textarea id="message" rows="1" placeholder="Écris ta réponse…"
                autocomplete="off" maxlength="1000"></textarea>
      <button id="envoyer" type="submit" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3.4 20.4 21 12 3.4 3.6 3.4 10.2 15.6 12 3.4 13.8z"/>
        </svg>
      </button>
    </form>
    <p class="mention">
      Assistant scripté, sans modèle de langage — il ne parle que d'orientation
      scolaire. Modèle entraîné sur des données simulées : outil d'aide à la
      décision, pas une orientation officielle. · <a href="/docs">API</a>
    </p>
  </div>
</footer>

<script>
const COULEURS = { SMP: "var(--smp)", SVT: "var(--svt)", SES: "var(--ses)", LLA: "var(--lla)" };

const $ = (id) => document.getElementById(id);
const fil = $("fil");
const conversation = $("conversation");
const champMessage = $("message");
const boutonEnvoyer = $("envoyer");

let etat = null;
let occupe = false;

/* ---------------------------------------------------------------
   Rendu de texte : le contenu est d'abord échappé, puis seules
   quelques marques simples sont réinterprétées. Aucune balise
   venue du serveur ou de l'élève n'est injectée telle quelle.
---------------------------------------------------------------- */
function echapper(texte) {
  const div = document.createElement("div");
  div.textContent = texte;
  return div.innerHTML;
}

function rendre(texte) {
  const lignes = echapper(texte).split("\n");
  let html = "";
  let dansListe = false;

  for (const ligne of lignes) {
    const puce = ligne.match(/^\s*•\s+(.*)$/);
    if (puce) {
      if (!dansListe) { html += "<ul>"; dansListe = true; }
      html += `<li>${enrichir(puce[1])}</li>`;
      continue;
    }
    if (dansListe) { html += "</ul>"; dansListe = false; }
    if (ligne.trim() === "") continue;
    html += `<p>${enrichir(ligne)}</p>`;
  }
  if (dansListe) html += "</ul>";
  return html;
}

function enrichir(texte) {
  return texte
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/_([^_]+)_/g, "<em>$1</em>");
}

/* ---------------------------------------------------------------
   Construction des tours de conversation
---------------------------------------------------------------- */
function creerTour(role) {
  const tour = document.createElement("div");
  tour.className = `tour ${role}`;

  const avatar = document.createElement("div");
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === "ia" ? "🎓" : "🙂";
  avatar.setAttribute("aria-hidden", "true");

  const contenu = document.createElement("div");
  contenu.className = "contenu";

  tour.append(avatar, contenu);
  fil.append(tour);
  return contenu;
}

function ajouterMessageUtilisateur(texte) {
  const contenu = creerTour("moi");
  const bulle = document.createElement("div");
  bulle.className = "bulle";
  bulle.textContent = texte;
  contenu.append(bulle);
  defiler();
}

function carteResultat(message) {
  const carte = document.createElement("div");
  carte.className = "resultat";

  if (message.hypothese) {
    const etiquette = document.createElement("div");
    etiquette.className = "etiquette";
    etiquette.textContent = "Hypothèse";
    carte.append(etiquette);
  }

  const serie = document.createElement("p");
  serie.className = "serie";
  serie.textContent = message.serie;
  serie.style.color = COULEURS[message.serie] || "var(--accent)";
  carte.append(serie);

  const libelle = document.createElement("p");
  libelle.className = "libelle";
  libelle.textContent = message.libelle;
  carte.append(libelle);

  const entrees = Object.entries(message.probabilites || {})
    .sort((a, b) => b[1] - a[1]);

  for (const [nom, valeur] of entrees) {
    const bloc = document.createElement("div");
    bloc.className = "barre-proba" + (nom === message.serie ? "" : " secondaire");
    bloc.innerHTML = `
      <div class="entete">
        <span class="nom"></span>
        <span class="valeur"></span>
      </div>
      <div class="piste"><div class="remplissage"></div></div>`;
    bloc.querySelector(".nom").textContent = nom;
    bloc.querySelector(".valeur").textContent =
      (valeur * 100).toFixed(1).replace(".", ",") + " %";
    const remplissage = bloc.querySelector(".remplissage");
    remplissage.style.background = COULEURS[nom] || "var(--accent)";
    // Largeur posée au tour suivant pour que la transition CSS s'anime.
    requestAnimationFrame(() => {
      remplissage.style.width = (valeur * 100).toFixed(2) + "%";
    });
    carte.append(bloc);
  }
  return carte;
}

function ajouterMessagesAssistant(messages) {
  const contenu = creerTour("ia");
  for (const message of messages) {
    if (message.contenu) {
      const bulle = document.createElement("div");
      bulle.className = "bulle" + (message.type === "avertissement" ? " alerte" : "");
      bulle.innerHTML = rendre(message.contenu);
      contenu.append(bulle);
    }
    if (message.type === "resultat") contenu.append(carteResultat(message));
  }
  defiler();
}

function afficherFrappe() {
  const contenu = creerTour("ia");
  const bulle = document.createElement("div");
  bulle.className = "bulle";
  bulle.innerHTML = '<div class="frappe"><span></span><span></span><span></span></div>';
  contenu.append(bulle);
  defiler();
  return contenu.parentElement;
}

function defiler() {
  requestAnimationFrame(() => {
    conversation.scrollTop = conversation.scrollHeight;
  });
}

function afficherSuggestions(suggestions) {
  const zone = $("suggestions");
  zone.innerHTML = "";
  for (const suggestion of suggestions || []) {
    const puce = document.createElement("button");
    puce.type = "button";
    puce.className = "puce";
    puce.textContent = suggestion;
    puce.addEventListener("click", () => envoyer(suggestion));
    zone.append(puce);
  }
}

/* ---------------------------------------------------------------
   Échange avec le serveur
---------------------------------------------------------------- */
async function envoyer(texte) {
  if (occupe) return;
  const message = (texte ?? champMessage.value).trim();
  if (!message) return;

  occupe = true;
  boutonEnvoyer.disabled = true;
  ajouterMessageUtilisateur(message);
  champMessage.value = "";
  ajusterHauteur();
  afficherSuggestions([]);

  const indicateur = afficherFrappe();

  try {
    const reponse = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, etat }),
    });
    if (!reponse.ok) {
      const corps = await reponse.json().catch(() => ({}));
      throw new Error(corps.detail || `Le serveur a répondu ${reponse.status}.`);
    }
    const donnees = await reponse.json();
    indicateur.remove();
    etat = donnees.etat;
    ajouterMessagesAssistant(donnees.messages);
    afficherSuggestions(donnees.suggestions);
    if (donnees.modele) {
      $("sous-titre").textContent =
        `Nouveau Secondaire — SMP, SVT, SES, LLA · modèle : ${donnees.modele}`;
    }
  } catch (erreur) {
    indicateur.remove();
    ajouterMessagesAssistant([{
      type: "avertissement",
      contenu: "Je n'ai pas pu joindre le serveur : " + erreur.message,
    }]);
  } finally {
    occupe = false;
    boutonEnvoyer.disabled = false;
    champMessage.focus();
  }
}

async function demarrer() {
  const indicateur = afficherFrappe();
  try {
    const reponse = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: null, etat: null }),
    });
    const donnees = await reponse.json();
    indicateur.remove();
    if (!reponse.ok) throw new Error(donnees.detail || "Service indisponible.");
    etat = donnees.etat;
    ajouterMessagesAssistant(donnees.messages);
    afficherSuggestions(donnees.suggestions);
    if (donnees.modele) {
      $("sous-titre").textContent =
        `Nouveau Secondaire — SMP, SVT, SES, LLA · modèle : ${donnees.modele}`;
    }
  } catch (erreur) {
    indicateur.remove();
    ajouterMessagesAssistant([{
      type: "avertissement",
      contenu: "Le service n'est pas disponible : " + erreur.message,
    }]);
  }
}

/* ---------------------------------------------------------------
   Saisie
---------------------------------------------------------------- */
function ajusterHauteur() {
  champMessage.style.height = "auto";
  champMessage.style.height = Math.min(champMessage.scrollHeight, 150) + "px";
}

champMessage.addEventListener("input", ajusterHauteur);
champMessage.addEventListener("keydown", (evenement) => {
  if (evenement.key === "Enter" && !evenement.shiftKey) {
    evenement.preventDefault();
    envoyer();
  }
});
$("formulaire").addEventListener("submit", (evenement) => {
  evenement.preventDefault();
  envoyer();
});

demarrer();
champMessage.focus();
</script>
</body>
</html>
